name: Oxidum AppImage channel

on:
  push:
    branches:
      - main
    paths:
      - 'launcher/**'
      - 'packaging/linux/**'
      - 'packaging/icons/**'
      - 'tools/fork/**'
      - '.github/workflows/oxidum-appimage.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'packaging/linux/**'
      - 'packaging/icons/**'
      - 'tools/fork/**'
      - '.github/workflows/oxidum-appimage.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxidum-appimage-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: oxidum-appimage
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf
      - name: Validate Oxidum overlay against locked upstream
        working-directory: .
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fork/apply_overlay.py tools/fork/verify_overlay.py
          upstream_sha=$(tr -d '[:space:]' < tools/fork/upstream.lock)
          [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error file=tools/fork/upstream.lock::Expected one 40-character Git SHA, got '$upstream_sha'"
            exit 1
          }
          echo "Validating Oxidum overlay against Horizon-Free $upstream_sha"
          temp="$RUNNER_TEMP/oxidum-overlay-test"
          rm -rf "$temp"
          git init -q "$temp"
          git -C "$temp" remote add origin https://github.com/0CYBER/horizon-free.git
          git -C "$temp" fetch -q --depth=1 origin "$upstream_sha"
          git -C "$temp" checkout -q --detach FETCH_HEAD
          test "$(git -C "$temp" rev-parse HEAD)" = "$upstream_sha"
          mkdir -p "$temp/packaging/icons/hicolor/scalable/apps"
          cp packaging/icons/hicolor/scalable/apps/oxidum.svg "$temp/packaging/icons/hicolor/scalable/apps/oxidum.svg"
          mkdir -p "$temp/packaging/icons/hicolor/256x256/apps"
          cp packaging/icons/hicolor/256x256/apps/oxidum.png "$temp/packaging/icons/hicolor/256x256/apps/oxidum.png"
          (cd "$temp" && python3 "$GITHUB_WORKSPACE/tools/fork/apply_overlay.py")
          git -C "$temp" apply --check "$GITHUB_WORKSPACE/tools/fork/gpu-selection.patch"
          git -C "$temp" apply "$GITHUB_WORKSPACE/tools/fork/gpu-selection.patch"
          python3 tools/fork/verify_overlay.py "$temp"
      - name: Test launcher
        run: cargo test --release --locked
      - name: Build launcher
        run: cargo build --release --locked
      - name: Package AppImage
        run: |
          version=$(target/release/horizon-launcher --version | awk '{print $2}')
          rm -rf out && mkdir out
          ../packaging/linux/appimage.sh target/release/horizon-launcher "$version" out
          sha256sum out/oxidum-linux-x86_64.AppImage
      - name: Verify packaged Oxidum identity
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/oxidum-appimage-root"
          mkdir -p "$RUNNER_TEMP/oxidum-appimage-root"
          (
            cd "$RUNNER_TEMP/oxidum-appimage-root"
            "$GITHUB_WORKSPACE/launcher/out/oxidum-linux-x86_64.AppImage" --appimage-extract >/dev/null
          )
          bin="$RUNNER_TEMP/oxidum-appimage-root/squashfs-root/usr/bin/horizon-launcher"
          strings_file="$RUNNER_TEMP/oxidum-appimage.strings"
          strings "$bin" > "$strings_file"
          grep -Fq 'OXIDUM' "$strings_file" || {
            echo "::error::Packaged launcher is missing the OXIDUM wordmark"
            exit 1
          }
          grep -Fq 'https://github.com/LeahRCS/Oxidum' "$strings_file" || {
            echo "::error::Packaged launcher is missing the Oxidum repository link"
            exit 1
          }
          if grep -Fq 'https://github.com/0CYBER/horizon-free' "$strings_file"; then
            echo "::error::Packaged launcher still contains the old Horizon-Free repository branding"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: oxidum-appimage
          path: launcher/out/oxidum-linux-x86_64.AppImage
          retention-days: 7

  mirror-release:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest upstream launcher release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(curl -fsSL -H "Accept: application/vnd.github+json"             https://api.github.com/repos/0CYBER/horizon-free/releases?per_page=30)
          tag=$(jq -r '[.[] | select(.draft == false) | select(.tag_name | startswith("launcher@"))][0].tag_name' <<<"$json")
          [[ -n "$tag" && "$tag" != null ]] || { echo "::error::No upstream launcher release found"; exit 1; }
          version=${tag#launcher@}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save fork overlay
        if: steps.upstream.outputs.exists != 'true'
        run: |
          cp tools/fork/apply_overlay.py "$RUNNER_TEMP/apply_overlay.py"
          cp tools/fork/verify_overlay.py "$RUNNER_TEMP/verify_overlay.py"
          cp tools/fork/gpu-selection.patch "$RUNNER_TEMP/gpu-selection.patch"
          cp packaging/icons/hicolor/scalable/apps/oxidum.svg "$RUNNER_TEMP/oxidum.svg"
          cp packaging/icons/hicolor/256x256/apps/oxidum.png "$RUNNER_TEMP/oxidum.png"

      - name: Check out exact upstream release source
        if: steps.upstream.outputs.exists != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git fetch --force --depth=1 https://github.com/0CYBER/horizon-free.git "refs/tags/$TAG"
          git checkout --detach FETCH_HEAD
          mkdir -p packaging/icons/hicolor/scalable/apps
          cp "$RUNNER_TEMP/oxidum.svg" packaging/icons/hicolor/scalable/apps/oxidum.svg
          mkdir -p packaging/icons/hicolor/256x256/apps
          cp "$RUNNER_TEMP/oxidum.png" packaging/icons/hicolor/256x256/apps/oxidum.png
          python3 "$RUNNER_TEMP/apply_overlay.py"
          git apply --check "$RUNNER_TEMP/gpu-selection.patch"
          git apply "$RUNNER_TEMP/gpu-selection.patch"
          python3 "$RUNNER_TEMP/verify_overlay.py" .

      - uses: dtolnay/rust-toolchain@stable
        if: steps.upstream.outputs.exists != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.upstream.outputs.exists != 'true'
        with:
          workspaces: launcher
          shared-key: oxidum-release

      - name: Linux build dependencies
        if: steps.upstream.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf

      - name: Test and build exact upstream version with fork overlay
        if: steps.upstream.outputs.exists != 'true'
        working-directory: launcher
        env:
          HORIZON_LAUNCHER_VERSION: ${{ steps.upstream.outputs.version }}
          HORIZON_LAUNCHER_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          cargo test --release --locked
          cargo build --release --locked
          test "$(target/release/horizon-launcher --version)" = "horizon-launcher ${HORIZON_LAUNCHER_VERSION}"

      - name: Package AppImage
        if: steps.upstream.outputs.exists != 'true'
        working-directory: launcher
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          rm -rf out && mkdir out
          ../packaging/linux/appimage.sh target/release/horizon-launcher "$VERSION" out
          (cd out && sha256sum oxidum-linux-x86_64.AppImage > SHA256SUMS)

      - name: Publish fork release
        if: steps.upstream.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target main             --title "Oxidum $VERSION"             --notes "Oxidum AppImage build of upstream $TAG, with Oxidum branding, LeahRCS update channel and Linux packaging. Source release: https://github.com/0CYBER/horizon-free/releases/tag/$TAG"             launcher/out/oxidum-linux-x86_64.AppImage             launcher/out/SHA256SUMS
