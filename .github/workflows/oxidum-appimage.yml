name: Oxidum AppImage channel

on:
  push:
    branches:
      - main
    paths:
      - 'launcher/**'
      - 'packaging/linux/**'
      - 'packaging/icons/**'
      - 'tools/fork/**'
      - '.github/workflows/oxidum-appimage.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'packaging/linux/**'
      - 'packaging/icons/**'
      - 'tools/fork/**'
      - '.github/workflows/oxidum-appimage.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxidum-appimage-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: oxidum-appimage
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf
      - name: Validate Oxidum overlay against upstream
        working-directory: .
        run: |
          python3 -m py_compile tools/fork/apply_overlay.py
          temp="$RUNNER_TEMP/oxidum-overlay-test"
          git clone --depth 1 https://github.com/0CYBER/horizon-free.git "$temp"
          mkdir -p "$temp/packaging/icons/hicolor/scalable/apps"
          cp packaging/icons/hicolor/scalable/apps/oxidum.svg "$temp/packaging/icons/hicolor/scalable/apps/oxidum.svg"
          (cd "$temp" && python3 "$GITHUB_WORKSPACE/tools/fork/apply_overlay.py")
          grep -Fq 'LAUNCHER_REPO: &str = "LeahRCS/Oxidum"' "$temp/launcher/src/backend.rs"
          grep -Fq 'oxidum-linux-x86_64.AppImage' "$temp/launcher/src/backend.rs"
          grep -Fq 'title: Some("Oxidum".into())' "$temp/launcher/src/titlebar.rs"
          grep -Fq 'Icon=oxidum' "$temp/packaging/linux/horizon-launcher.desktop"
      - name: Test launcher
        run: cargo test --release --locked
      - name: Build launcher
        run: cargo build --release --locked
      - name: Package AppImage
        run: |
          version=$(target/release/horizon-launcher --version | awk '{print $2}')
          rm -rf out && mkdir out
          ../packaging/linux/appimage.sh target/release/horizon-launcher "$version" out
          sha256sum out/oxidum-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: oxidum-appimage
          path: launcher/out/oxidum-linux-x86_64.AppImage
          retention-days: 7

  mirror-release:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest upstream launcher release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(curl -fsSL -H "Accept: application/vnd.github+json"             https://api.github.com/repos/0CYBER/horizon-free/releases?per_page=30)
          tag=$(jq -r '[.[] | select(.draft == false) | select(.tag_name | startswith("launcher@"))][0].tag_name' <<<"$json")
          [[ -n "$tag" && "$tag" != null ]] || { echo "::error::No upstream launcher release found"; exit 1; }
          version=${tag#launcher@}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save fork overlay
        if: steps.upstream.outputs.exists != 'true'
        run: |
          cp tools/fork/apply_overlay.py "$RUNNER_TEMP/apply_overlay.py"
          cp packaging/icons/hicolor/scalable/apps/oxidum.svg "$RUNNER_TEMP/oxidum.svg"

      - name: Check out exact upstream release source
        if: steps.upstream.outputs.exists != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git fetch --force --depth=1 https://github.com/0CYBER/horizon-free.git "refs/tags/$TAG"
          git checkout --detach FETCH_HEAD
          mkdir -p packaging/icons/hicolor/scalable/apps
          cp "$RUNNER_TEMP/oxidum.svg" packaging/icons/hicolor/scalable/apps/oxidum.svg
          python3 "$RUNNER_TEMP/apply_overlay.py"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.upstream.outputs.exists != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.upstream.outputs.exists != 'true'
        with:
          workspaces: launcher
          shared-key: oxidum-release

      - name: Linux build dependencies
        if: steps.upstream.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf

      - name: Test and build exact upstream version with fork overlay
        if: steps.upstream.outputs.exists != 'true'
        working-directory: launcher
        env:
          HORIZON_LAUNCHER_VERSION: ${{ steps.upstream.outputs.version }}
          HORIZON_LAUNCHER_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          cargo test --release --locked
          cargo build --release --locked
          test "$(target/release/horizon-launcher --version)" = "horizon-launcher ${HORIZON_LAUNCHER_VERSION}"

      - name: Package AppImage
        if: steps.upstream.outputs.exists != 'true'
        working-directory: launcher
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          rm -rf out && mkdir out
          ../packaging/linux/appimage.sh target/release/horizon-launcher "$VERSION" out
          (cd out && sha256sum oxidum-linux-x86_64.AppImage > SHA256SUMS)

      - name: Publish fork release
        if: steps.upstream.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target main             --title "Oxidum $VERSION"             --notes "Oxidum AppImage build of upstream $TAG, with Oxidum branding, LeahRCS update channel and Linux packaging. Source release: https://github.com/0CYBER/horizon-free/releases/tag/$TAG"             launcher/out/oxidum-linux-x86_64.AppImage             launcher/out/SHA256SUMS
